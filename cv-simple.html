            `).join('');

            const eduHTML = tr.eduItems.map(item => `
                <div class="education-item">
                    <div class="education-header">
                        <div class="education-title">${item.title}</div>
                        <div class="school">${item.school}</div>
                        <div class="date">${item.date}</div>
                    </div>
                </div>
            `).join('');

            const skillsHTML = tr.skillCategories.map(cat => `
                <div class="skill-category">
                    <h3>${cat.name}</h3>
                    <div class="skills">
                        ${cat.tags.map(tag => `<span class="skill-tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');

            const competenciesHTML = tr.competencies.map(c => `<div class="competency">${c}</div>`).join('');

            const languagesHTML = tr.languageList.map(l => `
                <span class="language"><strong>${l.label}:</strong> ${l.level}</span>
            `).join('');

            const projectsHTML = tr.projects.map(p => `
                <div class="project">
                    <div class="project-header">
                        <div class="project-title">${p.title}</div>
                        <div class="project-company">${p.company}</div>
                        <div class="date">${p.date}</div>
                    </div>
                    <p class="project-description">${p.desc}</p>
                </div>
            `).join('');

            document.getElementById('cv-root').innerHTML = `
                <div class="print-instructions no-print">
                    <p><strong>📄 ${tr.saveAsPdf}:</strong> ${tr.printInstructions}</p>
                    <button onclick="window.print()" class="print-btn">${tr.saveAsPdfBtn}</button>
                </div>

                <div class="header">
                    <h1>Mikail Odabas</h1>
                    <p class="title">${tr.jobTitle}</p>
                    <div class="contact">
                        <span>📞 +31 6 83 77 77 80</span>
                        <span>✉ mikailodabas@hotmail.com</span>
                        <span>📍 Enschede, Netherlands</span>
                    </div>
                </div>

                <div class="section">
                    <h2>${tr.professionalSummary}</h2>
                    <p class="summary">${tr.summaryText1}</p>
                    <p class="summary" style="margin-top: 15px;">${tr.summaryText2}</p>
                </div>

                <div class="section">
                    <h2>${tr.coreCompetencies}</h2>
                    <div class="core-competencies">${competenciesHTML}</div>
                </div>

                <div class="section">
                    <h2>${tr.professionalExperience}</h2>
                    ${jobsHTML}
                </div>

                <div class="section">
                    <h2>${tr.education}</h2>
                    ${eduHTML}
                </div>

                <div class="section">
                    <h2>${tr.skillsExpertise}</h2>
                    <div class="skills-grid">${skillsHTML}</div>
                </div>

                <div class="section">
                    <h2>${tr.languages}</h2>
                    <div class="languages">${languagesHTML}</div>
                </div>

                <div class="section">
                    <h2>${tr.projectsInternships}</h2>
                    ${projectsHTML}
                </div>
            `;
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', buildCV);
        } else {
            buildCV();
        }
    </script>
</body>
</html>
